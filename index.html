<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propro9</title>
    <meta name="description" content="Propro9">
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --background: #0b0c10;
            --panel: rgba(22, 24, 32, 0.78);
            --panel-hover: rgba(27, 30, 40, 0.92);
            --border: #2a2e39;
            --text: #f0f2f6;
            --muted: #9299a8;
            --dim: #5f6674;
            --accent: #0047ab;
            --accent-bright: #1e6edb;
            --accent-soft: rgba(0, 71, 171, 0.14);
        }

        html,
        body {
            min-height: 100%;
            background: var(--background);
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            color: var(--text);
            font-family: "Courier New", Courier, monospace;

            background:
                radial-gradient(circle at 76% 10%, rgba(0, 71, 171, 0.11), transparent 31%),
                radial-gradient(circle at 18% 84%, rgba(30, 110, 219, 0.06), transparent 32%),
                var(--background);
        }

        /* faint grid */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.008) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.46), transparent 88%);
            z-index: 0;
        }
25%  { transform: translate(1%, -1%); }
            50%  { transform: translate(-1%, 1%); }
            75%  { transform: translate(1%, 1%); }
            100% { transform: translate(0, 0); }
        }

        .vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 3;
            box-shadow: inset 0 0 180px rgba(0, 0, 0, 0.72);
        }

        /* slow background glow */
        .ambient {
            position: fixed;
            width: 520px;
            height: 520px;
            left: 50%;
            top: 45%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(
                circle,
                rgba(30, 110, 219, 0.10) 0%,
                rgba(0, 71, 171, 0.05) 38%,
                transparent 70%
            );
            filter: blur(26px);
            pointer-events: none;
            z-index: 0;
            animation: ambientFloat 11s ease-in-out infinite alternate;
        }

        @keyframes ambientFloat {
            from {
                transform: translate(-54%, -52%) scale(0.95);
            }
            to {
                transform: translate(-46%, -47%) scale(1.07);
            }
        }

        .center-mark {
            position: fixed;
            left: 50%;
            top: 45%;
            transform: translate(-50%, -50%);
            z-index: 1;
            user-select: none;
            pointer-events: none;
            text-align: center;
        }

        .center-mark h1 {
            font-size: clamp(52px, 10vw, 140px);
            line-height: 0.9;
            letter-spacing: -0.075em;
            color: rgba(240, 242, 246, 0.055);
            text-shadow: 0 0 42px rgba(30, 110, 219, 0.08);
        }

        .center-line {
            width: min(280px, 36vw);
            height: 1px;
            margin: 18px auto 0;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(30, 110, 219, 0.42),
                transparent
            );
        }

        a,
        button {
            font: inherit;
        }

        /* random video button */
        .random-video {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 10;

            width: 46px;
            height: 46px;

            display: grid;
            place-items: center;

            color: var(--muted);
            background: rgba(22, 24, 32, 0.72);

            border: 1px solid var(--border);
            border-radius: 50%;

            font-size: 17px;

            backdrop-filter: blur(14px);

            transition:
                color 0.18s ease,
                background 0.18s ease,
                border-color 0.18s ease,
                transform 0.18s ease,
                box-shadow 0.18s ease;
        }

        .random-video:hover {
            color: white;
            background: var(--panel-hover);
            border-color: var(--accent-bright);
            transform: translateY(-2px) rotate(5deg);
            box-shadow: 0 10px 28px rgba(0, 71, 171, 0.15);
        }

        .random-video:active {
            transform: translateY(0);
        }

        /* Saul easter egg */
        .saul {
            position: fixed;
            left: 18px;
            bottom: 16px;
            z-index: 2;

            width: 92px;
            height: 58px;
            object-fit: cover;
            object-position: 50% 24%;

            opacity: 0.16;
            filter: saturate(0.55) contrast(1.03);
            border-radius: 7px;

            border: 1px solid rgba(255, 255, 255, 0.06);

            transition:
                opacity 0.22s ease,
                transform 0.22s ease,
                filter 0.22s ease;
        }

        .saul:hover {
            opacity: 0.82;
            filter: saturate(0.9) contrast(1.04);
            transform: translateY(-3px) scale(1.035);
        }

        /* footer */
        .footer {
            position: fixed;
            left: 50%;
            bottom: 24px;
            width: min(720px, calc(100% - 40px));
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
        }

        .links {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }

        .link-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 112px;
            padding: 11px 17px;

            color: var(--text);
            text-decoration: none;

            background:
                linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.025),
                    rgba(255, 255, 255, 0)
                ),
                var(--panel);

            border: 1px solid var(--border);
            border-radius: 7px;

            font-size: 12px;
            font-weight: bold;

            backdrop-filter: blur(14px);

            transition:
                color 0.18s ease,
                background 0.18s ease,
                border-color 0.18s ease,
                transform 0.18s ease,
                box-shadow 0.18s ease;
        }

        .link-button:hover {
            color: white;
            background:
                linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.03),
                    transparent
                ),
                var(--accent-soft);

            border-color: var(--accent-bright);

            transform: translateY(-3px);

            box-shadow:
                0 9px 28px rgba(0, 71, 171, 0.14),
                inset 0 0 22px rgba(30, 110, 219, 0.035);
        }

        .link-button:active {
            transform: translateY(0);
        }

        .copyright {
            color: var(--dim);
            font-size: 10px;
            line-height: 1.65;
        }

        .copyright strong {
            color: var(--muted);
            font-weight: normal;
        }

        /* custom cursor */
        @media (pointer: fine) {
            html,
            body,
            body *,
            a,
            button,
            img {
                cursor: none !important;
            }
        }

        .cursor-dot {
            position: fixed;
            top: 0;
            left: 0;

            width: 9px;
            height: 9px;

            border-radius: 50%;
            background: #e6f0ff;

            box-shadow:
                0 0 0 1px rgba(0, 0, 0, 0.35),
                0 0 10px rgba(230, 240, 255, 0.34);

            pointer-events: none;
            transform: translate(-50%, -50%);
            opacity: 0;
            z-index: 9999;

            transition:
                opacity 0.10s ease,
                width 0.10s ease,
                height 0.10s ease,
                background 0.10s ease;
        }

        .cursor-dot.interactive {
            width: 14px;
            height: 14px;
            background: rgba(230, 240, 255, 0.12);
            border: 1px solid #e6f0ff;
            box-shadow: 0 0 11px rgba(230, 240, 255, 0.26);
        }

        .cursor-dot.pressed {
            width: 6px;
            height: 6px;
        }

        .cursor-glow {
            position: fixed;
            top: 0;
            left: 0;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(30, 110, 219, 0.14) 0%,
                    rgba(30, 110, 219, 0.065) 32%,
                    rgba(30, 110, 219, 0.025) 55%,
                    transparent 72%
                );

            filter: blur(10px);
            pointer-events: none;

            transform: translate(-50%, -50%);
            opacity: 0;
            z-index: 1;

            transition: opacity 0.18s ease;
        }

        @media (pointer: coarse) {
            .cursor-dot,
            .cursor-glow {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .ambient {
                animation: none;
            }
        }

        @media (max-width: 620px) {
            .random-video {
                top: 16px;
                right: 16px;
            }

            .footer {
                bottom: 18px;
            }

            .link-button {
                min-width: 96px;
                padding: 10px 13px;
                font-size: 11px;
            }

            .saul {
                width: 68px;
                height: 44px;
                left: 12px;
                bottom: 12px;
            }

            .center-mark {
                top: 41%;
            }
        }
    </style>
</head>

<body>
    <div class="ambient"></div>
    <div class="vignette"></div>

    <div class="cursor-glow" id="cursor-glow"></div>
    <div class="cursor-dot" id="cursor-dot"></div>

    <div class="center-mark" aria-hidden="true">
        <h1>Propro9</h1>
        <div class="center-line"></div>
    </div>

    <button
        class="random-video"
        id="random-video-button"
        type="button"
        aria-label="Open a random YouTube video"
        title="Random YouTube Video">
        ▶
    </button>

    <img
        class="saul"
        src="saul.png"
        alt=""
        title="he is here">

    <footer class="footer">
        <div class="links">
            <a
                class="link-button"
                href="https://propro-9.itch.io/"
                target="_blank"
                rel="noopener noreferrer">
                itch.io
            </a>

            <a
                class="link-button"
                href="https://discord.gg/TgCeMFfEwG"
                target="_blank"
                rel="noopener noreferrer">
                Discord
            </a>

            <a
                class="link-button"
                href="https://www.youtube.com/@Propro_9"
                target="_blank"
                rel="noopener noreferrer">
                YouTube
            </a>
        </div>

        <div class="copyright">
            © 2026 <strong>Bowen S.</strong><br>
            All rights reserved.
        </div>
    </footer>

    <script>
        const randomVideoButton =
            document.getElementById("random-video-button");

        const randomVideos = [
            "https://www.youtube.com/watch?v=jNQXAC9IVRw",
            "https://www.youtube.com/watch?v=9bZkp7q19f0",
            "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
            "https://www.youtube.com/watch?v=GHiOrkQlIGM",
            "https://www.youtube.com/watch?v=IVYjJ5eEmuk",
            "https://www.youtube.com/watch?v=nOJd3xoKMyI",
            "https://www.youtube.com/watch?v=v3Jr9dGHbG4",
            "https://www.youtube.com/watch?v=FtutLA63Cp8",
            "https://www.youtube.com/watch?v=tVlKLpxyCBY"
        ];

        randomVideoButton.addEventListener("click", () => {
            const randomIndex =
                Math.floor(Math.random() * randomVideos.length);

            window.open(
                randomVideos[randomIndex],
                "_blank",
                "noopener,noreferrer"
            );
        });

        const cursorDot =
            document.getElementById("cursor-dot");

        const cursorGlow =
            document.getElementById("cursor-glow");

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let glowX = mouseX;
        let glowY = mouseY;

        document.addEventListener("mousemove", event => {
            mouseX = event.clientX;
            mouseY = event.clientY;

            cursorDot.style.left = `${event.clientX}px`;
            cursorDot.style.top = `${event.clientY}px`;
            cursorDot.style.opacity = "1";
            cursorGlow.style.opacity = "1";
        });

        document.addEventListener("mouseleave", () => {
            cursorDot.style.opacity = "0";
            cursorGlow.style.opacity = "0";
        });

        document
            .querySelectorAll("a, button, .saul")
            .forEach(element => {
                element.addEventListener("mouseenter", () => {
                    cursorDot.classList.add("interactive");
                });

                element.addEventListener("mouseleave", () => {
                    cursorDot.classList.remove("interactive");
                });
            });

        document.addEventListener("mousedown", () => {
            cursorDot.classList.add("pressed");
        });

        document.addEventListener("mouseup", () => {
            cursorDot.classList.remove("pressed");
        });

        function updateCursorGlow() {
            glowX += (mouseX - glowX) * 0.12;
            glowY += (mouseY - glowY) * 0.12;

            cursorGlow.style.left = `${glowX}px`;
            cursorGlow.style.top = `${glowY}px`;

            requestAnimationFrame(updateCursorGlow);
        }

        updateCursorGlow();
    </script>
</body>
</html>
