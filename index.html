<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Propro9 | Projects</title>

    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 50px 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            border: 2px solid #333;
            background-color: #1a1a1a;
            padding: 30px;
            border-radius: 8px;
        }

        h1 {
            color: #ff4757;
        }

        a {
            color: #5352ed;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }

        a:hover {
            color: #ff4757;
        }

        .links {
            margin-top: 30px;
        }

        .stats {
            margin-top: 30px;
            color: #888888;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Propro9</h1>

        <p>Hi there! I make stuff</p>
        <p>You should lowk look at some of my stuff</p>

        <div class="links">
            <a href="https://propro-9.itch.io/"
               target="_blank"
               rel="noopener noreferrer">
                itch.io
            </a>

            <a href="https://discord.gg/TgCeMFfEwG"
               target="_blank"
               rel="noopener noreferrer">
                discord
            </a>

            <a href="https://www.youtube.com/@Propro_9"
               target="_blank"
               rel="noopener noreferrer">
                YouTube
            </a>
        </div>

        <div class="stats">
            Unique visitors:
            <span id="unique-visitors">...</span>
        </div>
    </div>

    <script>
        const API = "https://countapi.mileshilliard.com/api/v1";
        const COUNTER = "propro9-unique-visitors-v2";
        const VISITED_KEY = "propro9_visitor_counted_v2";

        async function updateVisitorCount() {
            const counterDisplay =
                document.getElementById("unique-visitors");

            try {
                if (!localStorage.getItem(VISITED_KEY)) {
                    localStorage.setItem(VISITED_KEY, "yes");

                    const response =
                        await fetch(`${API}/hit/${COUNTER}`);

                    const data = await response.json();

                    counterDisplay.textContent = data.value;
                } else {
                    const response =
                        await fetch(`${API}/get/${COUNTER}`);

                    const data = await response.json();

                    counterDisplay.textContent = data.value;
                }
            } catch (error) {
                console.error("Counter creature died:", error);
                counterDisplay.textContent = "???";
            }
        }

        updateVisitorCount();
    </script>
</body>
</html>
