<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Propro9 | Projects</title>

    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 50px 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            border: 2px solid #333;
            background-color: #1a1a1a;
            padding: 30px;
            border-radius: 8px;
        }

        h1 {
            color: #ff4757;
        }

        a {
            color: #5352ed;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }

        a:hover {
            color: #ff4757;
        }

        .links {
            margin-top: 30px;
        }

        .visitor-counter {
            margin-top: 30px;
            color: #888888;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Propro9</h1>

        <p>Hi there! I make stuff</p>
        <p>You should lowk look at some of my stuff</p>

        <div class="links">

            <a
                href="https://propro-9.itch.io/"
                target="_blank"
                rel="noopener noreferrer"
            >
                itch.io
            </a>

            <a
                href="https://discord.gg/TgCeMFfEwG"
                target="_blank"
                rel="noopener noreferrer"
            >
                discord
            </a>

            <a
                href="https://www.youtube.com/@Propro_9"
                target="_blank"
                rel="noopener noreferrer"
            >
                YouTube
            </a>

        </div>

        <p class="visitor-counter">
            Lifetime visits:
            <span id="visitor-count">...</span>
        </p>
    </div>

    <script>
        const counterKey = "propro9-github-site-visits-2026";

        fetch(
            `https://countapi.mileshilliard.com/api/v1/hit/${counterKey}`
        )
            .then(response => response.json())
            .then(data => {
                document.getElementById("visitor-count").textContent =
                    data.value;
            })
            .catch(error => {
                console.error("Visitor counter exploded 💀", error);

                document.getElementById("visitor-count").textContent =
                    "???";
            });
    </script>
</body>
</html>
